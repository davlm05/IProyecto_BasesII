name: medicitas
services:
  postgres:
    image: postgres:16
    container_name: postgresDB
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MEDICITAS_OWNER_PASSWORD=${MEDICITAS_OWNER_PASSWORD}
      - MEDICITAS_PLATFORM_PASSWORD=${MEDICITAS_PLATFORM_PASSWORD}
      - MEDICITAS_CLINIC_ADMIN_PASSWORD=${MEDICITAS_CLINIC_ADMIN_PASSWORD}
      - MEDICITAS_RECEPTION_PASSWORD=${MEDICITAS_RECEPTION_PASSWORD}
      - MEDICITAS_PROFESSIONAL_PASSWORD=${MEDICITAS_PROFESSIONAL_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    volumes:
      - ./db/docker/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
      - ./db/schema:/schema:ro
      - ./db/seed:/seed:ro
      - postgresData:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q
          && psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relname = 'clinics'" | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
  # *******************************************
  keycloakService:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloakService
    command: start-dev 	--import-realm	  # Se inicia en modo dev para omitir el uso de certificados
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresDB:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
    - ./realm-keycloak.json:/opt/keycloak/data/import/realm-keycloak.json:ro
    ports:
      - "${KC_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgresData:
